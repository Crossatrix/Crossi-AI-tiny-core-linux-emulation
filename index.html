<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TinyCore Linux</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    position: fixed;
    overscroll-behavior: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100dvh;
  }

  #status {
    position: absolute;
    top: 6px;
    left: 8px;
    font: 11px monospace;
    color: #6a6;
    z-index: 20;
    pointer-events: none;
    opacity: 0.85;
  }

  #screen_container {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #screen_container canvas {
    max-width: 100%;
    max-height: 100%;
    image-rendering: pixelated;
  }

  #screen_container > div {
    white-space: pre;
    font: 14px monospace;
    color: #0f0;
    line-height: 1.15;
  }

  /* --- On-screen keyboard --- */
  #kbd {
    flex: 0 0 auto;
    background: #161616;
    border-top: 1px solid #2a2a2a;
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)) 4px;
    display: none;
  }
  #kbd.visible { display: block; }

  #kbd_toggle_bar {
    flex: 0 0 auto;
    display: flex;
    background: #111;
  }
  #kbd_toggle {
    flex: 1;
    padding: 8px 0;
    background: #111;
    color: #7fd67f;
    border: none;
    font: 12px monospace;
    letter-spacing: 0.5px;
  }
  #kbd_toggle:active { background: #1a1a1a; }

  #btn_paste {
    flex: 0 0 90px;
    padding: 8px 0;
    background: #111;
    color: #7fd67f;
    border: none;
    border-left: 1px solid #2a2a2a;
    font: 12px monospace;
    letter-spacing: 0.5px;
  }
  #btn_paste:active { background: #1a1a1a; }

  #btn_upload {
    flex: 0 0 90px;
    padding: 8px 0;
    background: #111;
    color: #7fd67f;
    border: none;
    border-left: 1px solid #2a2a2a;
    font: 12px monospace;
    letter-spacing: 0.5px;
  }
  #btn_upload:active { background: #1a1a1a; }
  #btn_upload:disabled { color: #555; }

  #state_bar {
    flex: 0 0 auto;
    display: flex;
    background: #111;
    border-top: 1px solid #222;
  }
  #state_bar button {
    flex: 1;
    padding: 7px 0;
    background: #111;
    color: #7fd67f;
    border: none;
    border-right: 1px solid #2a2a2a;
    font: 11px monospace;
  }
  #state_bar button:last-child { border-right: none; }
  #state_bar button:active { background: #1a1a1a; }
  #state_bar button:disabled { color: #555; }

  /* --- Saves popup menu --- */
  #saves_overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 45;
  }
  #saves_overlay.open { display: block; }

  #saves_menu {
    display: none;
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(340px, 90vw);
    max-height: 80vh;
    background: #161616;
    border: 1px solid #333;
    border-radius: 8px;
    z-index: 46;
    flex-direction: column;
    overflow: hidden;
  }
  #saves_menu.open { display: flex; }

  #saves_menu_header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid #2a2a2a;
    color: #7fd67f;
    font: 12px monospace;
  }
  #saves_menu_close {
    background: none;
    border: none;
    color: #888;
    font: 16px monospace;
    padding: 2px 6px;
  }

  #saves_slots {
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .save_slot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    background: #1c1c1c;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    font: 11px monospace;
    color: #ccc;
  }
  .save_slot.active_slot { border-color: #4a7a4a; background: #1a221c; }
  .save_slot_info { flex: 1; min-width: 0; }
  .save_slot_title { color: #eee; font-size: 12px; margin-bottom: 2px; }
  .save_slot_meta { color: #888; font-size: 10px; }
  .save_slot_btns { display: flex; gap: 4px; flex: 0 0 auto; }
  .save_slot_btns button {
    background: #232323;
    color: #7fd67f;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 5px 8px;
    font: 10px monospace;
  }
  .save_slot_btns button:active { background: #2c2c2c; }
  .save_slot_btns button.danger { color: #c66; }
  .save_slot_btns button:disabled { color: #555; }

  #saves_autosave_row {
    padding: 10px 12px;
    border-top: 1px solid #2a2a2a;
    font: 11px monospace;
    color: #aaa;
  }
  #autosave_toggle_row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #autosave_interval {
    background: #1c1c1c;
    color: #eee;
    border: 1px solid #333;
    border-radius: 4px;
    font: 11px monospace;
    padding: 2px 4px;
  }
  #autosave_status {
    margin-top: 6px;
    color: #6a6;
    font-size: 10.5px;
  }

  .kbd_row {
    display: flex;
    gap: 3px;
    margin-bottom: 3px;
  }
  .kbd_row:last-child { margin-bottom: 0; }

  .key {
    flex: 1;
    background: #262626;
    color: #eee;
    border: 1px solid #363636;
    border-radius: 4px;
    font: 12px monospace;
    padding: 8px 0;
    text-align: center;
    min-width: 0;
  }
  .key:active, .key.active {
    background: #3a5a3a;
    border-color: #4a7a4a;
  }
  .key.wide  { flex: 1.6; }
  .key.wider { flex: 2.2; }
  .key.space { flex: 6; }
  .key.mod   { color: #7fd67f; font-size: 11px; }

  /* --- Mobile trackpad + click buttons --- */
  .mobile-only { display: none; }
  @media (pointer: coarse) {
    .mobile-only { display: flex; }
  }

  #pointer_bar {
    flex: 0 0 auto;
    gap: 4px;
    padding: 4px;
    background: #161616;
    border-top: 1px solid #2a2a2a;
  }

  #trackpad {
    flex: 1;
    height: 64px;
    background: #202020;
    border: 1px solid #333;
    border-radius: 6px;
    touch-action: none;
  }
  #trackpad.active {
    background: #26332a;
    border-color: #3a5a3a;
  }

  .mouse_btn {
    width: 64px;
    background: #262626;
    color: #eee;
    border: 1px solid #363636;
    border-radius: 6px;
    font: 11px monospace;
  }
  .mouse_btn:active, .mouse_btn.active {
    background: #3a5a3a;
    border-color: #4a7a4a;
  }

  /* --- AI chat panel --- */
  #chat_toggle {
    position: fixed;
    top: 6px;
    right: 8px;
    z-index: 30;
    background: #191919;
    color: #7fd67f;
    border: 1px solid #333;
    border-radius: 6px;
    font: 11px monospace;
    padding: 6px 10px;
  }
  #chat_toggle:active { background: #222; }

  #chat_panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    height: 100dvh;
    width: min(360px, 92vw);
    background: #131313;
    border-left: 1px solid #2a2a2a;
    z-index: 40;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.2s ease;
  }
  #chat_panel.open { transform: translateX(0); }

  #chat_header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid #2a2a2a;
    color: #7fd67f;
    font: 12px monospace;
  }
  #chat_close {
    background: none;
    border: none;
    color: #888;
    font: 16px monospace;
    line-height: 1;
    padding: 2px 6px;
  }

  #chat_messages {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .chat_msg {
    max-width: 88%;
    padding: 8px 10px;
    border-radius: 8px;
    font: 12.5px/1.4 monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .chat_msg.user {
    align-self: flex-end;
    background: #24422c;
    color: #dfe;
  }
  .chat_msg.ai {
    align-self: flex-start;
    background: #202020;
    color: #ddd;
  }
  .chat_msg.system {
    align-self: center;
    background: none;
    color: #777;
    font-size: 11px;
  }
  .chat_actions_note {
    display: block;
    margin-top: 4px;
    color: #6a6;
    font-size: 10.5px;
    cursor: pointer;
    user-select: none;
  }
  .chat_actions_note:hover { color: #8e8; }
  .chat_actions_note .caret {
    display: inline-block;
    transition: transform 0.15s ease;
    margin-right: 3px;
  }
  .chat_actions_note.expanded .caret {
    transform: rotate(90deg);
  }
  .chat_actions_log {
    display: none;
    margin-top: 4px;
    padding: 6px 8px;
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 5px;
    font-size: 10.5px;
    color: #aaa;
  }
  .chat_actions_log.expanded { display: block; }
  .chat_actions_log ol {
    margin: 0;
    padding-left: 16px;
  }
  .chat_actions_log li {
    margin-bottom: 2px;
    word-break: break-word;
  }

  #chat_input_row {
    flex: 0 0 auto;
    display: flex;
    border-top: 1px solid #2a2a2a;
    padding: env(safe-area-inset-bottom, 0) 0 0 0;
  }
  #chat_input {
    flex: 1;
    background: #191919;
    color: #eee;
    border: none;
    padding: 10px;
    font: 12.5px monospace;
    resize: none;
    height: 42px;
  }
  #chat_send {
    flex: 0 0 60px;
    background: #1c2e1f;
    color: #7fd67f;
    border: none;
    font: 12px monospace;
  }
  #chat_send:active { background: #25402a; }
  #chat_send:disabled { color: #555; }

  #chat_toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-top: 1px solid #2a2a2a;
  }
  #btn_screenshot {
    background: #191919;
    color: #7fd67f;
    border: 1px solid #333;
    border-radius: 5px;
    padding: 5px 10px;
    font: 11px monospace;
  }
  #btn_screenshot:active { background: #222; }

  #screenshot_preview {
    display: none;
    align-items: center;
    gap: 6px;
    font: 10.5px monospace;
    color: #888;
  }
  #screenshot_preview.attached { display: flex; }
  #screenshot_preview img {
    height: 34px;
    border: 1px solid #333;
    border-radius: 3px;
  }
  #screenshot_remove {
    background: none;
    border: none;
    color: #a55;
    font: 13px monospace;
    padding: 0 4px;
  }

  .chat_msg img.attached_shot {
    display: block;
    max-width: 100%;
    border-radius: 5px;
    margin-top: 6px;
    border: 1px solid #333;
  }
</style>
</head>

<script>
  const statusEl = document.getElementById("status");
  const screenContainer = document.getElementById("screen_container");
  const kbdToggle = document.getElementById("kbd_toggle");
  const kbdPanel = document.getElementById("kbd");

  // ============================================================
  // IndexedDB storage for full VM snapshots - up to 5 named slots,
  // plus a small "meta" store for settings (active slot, auto-save interval).
  // ============================================================
  const SNAPSHOT_DB_NAME = "tinycore_vm_snapshots";
  const SNAPSHOT_STORE = "snapshots"; // key: slot number 1-5, value: {data, savedAt, sizeBytes}
  const META_STORE = "meta";          // key: setting name, value: setting value
  const MAX_SLOTS = 5;

  function openSnapshotDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(SNAPSHOT_DB_NAME, 2);
      req.onupgradeneeded = (e) => {
        const db = req.result;
        if (!db.objectStoreNames.contains(SNAPSHOT_STORE)) {
          db.createObjectStore(SNAPSHOT_STORE);
        }
        if (!db.objectStoreNames.contains(META_STORE)) {
          db.createObjectStore(META_STORE);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function saveSnapshotToSlot(slot, arrayBuffer) {
    const db = await openSnapshotDB();
    const record = { data: arrayBuffer, savedAt: Date.now(), sizeBytes: arrayBuffer.byteLength };
    return new Promise((resolve, reject) => {
      const tx = db.transaction(SNAPSHOT_STORE, "readwrite");
      tx.objectStore(SNAPSHOT_STORE).put(record, slot);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function loadSnapshotFromSlot(slot) {
    const db = await openSnapshotDB();

  // Shift state - the guest OS itself combines scancode + shift to
  // produce the right character. So we only need to update what the
  // button *displays*, not what code it sends.
  const labeledKeys = document.querySelectorAll(".key[data-lower]");

    return heldModifiers.has("ShiftLeft") || heldModifiers.has("ShiftRight");
  }

      const isLetter = /^[a-z]$/i.test(lower);

      if (isLetter) {

    if (!code) { console.log("AI: unrecognized key name:", name); return; }
    keyDown(code);
    await sleep(40);
    keyUp(code);
  }

  async function aiClick() {
    if (!emulator.bus) return;
    emulator.bus.send("mouse-click", [true, false, false]);
    await sleep(60);
    emulator.bus.send("mouse-click", [false, false, false]);
  }

  async function aiMove(dx, dy) {
    if (!emulator.bus) return;
    emulator.bus.send("mouse-delta", [dx, -dy]);
    await sleep(50); // let the guest register the movement before any follow-up action
  }

  // Parses <key>"..."</key>, <text>"..."</text>, <move>"dx,dy"</move>,
  // and <click/> tags out of the AI's reply and runs them in order,
  // with a 300ms pause between each so the guest OS reliably registers
  // each action before the next one fires - important when a move is
  // immediately followed by a click, or a key press by another key press.
  const AI_ACTION_DELAY_MS = 300;

  async function runAiActions(replyText) {
    const tagRegex = /<key>"(.*?)"<\/key>|<text>"([\s\S]*?)"<\/text>|<move>"(.*?)"<\/move>|<click\s*\/>/g;
    let match;
    const log = [];
    while ((match = tagRegex.exec(replyText)) !== null) {
      if (match[1] !== undefined) {
        await pressNamedKey(match[1]);
        log.push(`Pressed key: "${match[1]}"`);
      } else if (match[2] !== undefined) {
        await emulator.keyboard_send_text(match[2]);
        log.push(`Typed text: "${match[2]}"`);
      } else if (match[3] !== undefined) {
        const parts = match[3].split(",").map((s) => parseInt(s.trim(), 10) || 0);
        const dx = parts[0] || 0, dy = parts[1] || 0;
        await aiMove(dx, dy);
        log.push(`Moved cursor: dx=${dx}, dy=${dy}`);
      } else {
        await aiClick();
        log.push("Left click");
      }
      await sleep(AI_ACTION_DELAY_MS);
    }
    return log;
  }

  // Keeps the running conversation so the AI has context across turns.
  const chatHistory = [
    {
      role: "system",
      content:
        "You are an AI assistant that can control a virtual computer running TinyCore Linux inside a web page. " +
        "The user can attach a screenshot of the current screen to their message - when an image is present, look at it carefully before deciding what actions to take. " +
        "To perform actions, include these tags anywhere in your reply: " +
        '<key>"a"</key> presses a single key (letters, digits, or names like Enter, Tab, Escape, Backspace, ArrowUp, F5, etc). ' +
        '<text>"hello world"</text> types out literal text. ' +
        '<move>"dx,dy"</move> moves the mouse cursor by a relative pixel offset. ' +
        "<click/> performs a left mouse click at the current cursor position. " +
        "You can include multiple tags in one reply and they will run in order. " +
        "Write a short natural-language reply explaining what you're doing, and include the tags for any actions you want performed.",
    },
  ];

  async function callAi(prompt, imageDataUrl) {
    // OpenRouter (OpenAI-compatible) multimodal format: content becomes
    // an array of parts instead of a plain string when an image is attached.
    const userMessage = imageDataUrl
      ? {
          role: "user",
          content: [
            { type: "text", text: prompt },
            { type: "image_url", image_url: { url: imageDataUrl } },
          ],
        }
      : { role: "user", content: prompt };

    chatHistory.push(userMessage);

    const res = await fetch(AI_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${AI_API_KEY}`,
      },
      body: JSON.stringify({
        model: AI_MODEL,
        messages: chatHistory,
      }),
    });

    const raw = await res.text();
    let content;
    try {
      const json = JSON.parse(raw);
      if (json.error) {
        throw new Error(json.error.message || JSON.stringify(json.error));
      }
      content = json.choices?.[0]?.message?.content ?? raw;
    } catch (e) {
      if (e.message && e.message !== raw) throw e; // real API error, surface it
      content = raw; // not JSON, use as-is
    }

    chatHistory.push({ role: "assistant", content: String(content) });
    return String(content);
  }

  async function sendChatMessage() {
    const prompt = chatInput.value.trim();
    if (!prompt) return;
    chatInput.value = "";
    chatSend.disabled = true;

    const imageForThisMessage = pendingScreenshot;
    appendChatMessage("user", prompt, null, imageForThisMessage);

    // Clear the attachment after sending so it doesn't stick to future messages
    pendingScreenshot = null;
    screenshotPreview.classList.remove("attached");

    const pending = appendChatMessage("ai", "…");

    try {
      const reply = await callAi(prompt, imageForThisMessage);
      // Strip action tags out of the displayed text so the chat log
      // stays readable; the tags themselves still get executed below.
      const displayText = reply
        .replace(/<key>"(.*?)"<\/key>/g, "")
        .replace(/<text>"([\s\S]*?)"<\/text>/g, "")
        .replace(/<move>"(.*?)"<\/move>/g, "")
        .replace(/<click\s*\/>/g, "")
        .trim();

      // Use a text node instead of textContent so we don't clobber any
      // child elements (there are none yet at this point, but keeps
      // this safe if that changes later).
      pending.firstChild
        ? (pending.firstChild.textContent = displayText || "(no reply text)")
        : pending.appendChild(document.createTextNode(displayText || "(no reply text)"));

      const actionLog = await runAiActions(reply);
      if (actionLog.length > 0) {
        const note = document.createElement("span");
        note.className = "chat_actions_note";

        const caret = document.createElement("span");
        caret.className = "caret";
        caret.textContent = "▶";
        note.appendChild(caret);
        note.appendChild(document.createTextNode(
          `Performed ${actionLog.length} action${actionLog.length === 1 ? "" : "s"} in the emulator`
        ));

        const details = document.createElement("div");
        details.className = "chat_actions_log";
        const ol = document.createElement("ol");
        actionLog.forEach((step) => {
          const li = document.createElement("li");
          li.textContent = step;
          ol.appendChild(li);
        });
        details.appendChild(ol);

        note.addEventListener("click", () => {
          note.classList.toggle("expanded");
          details.classList.toggle("expanded");
        });

        pending.appendChild(note);
        pending.appendChild(details);
      }
    } catch (err) {
      pending.textContent = "Error reaching AI: " + err.message;
    } finally {
      chatSend.disabled = false;
    }
  }

  chatSend.addEventListener("click", sendChatMessage);
  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendChatMessage();
    }
  });
</script>

</body>
</html>
