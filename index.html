<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TinyCore Linux</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    /* prevent iOS rubber-band scroll / pinch zoom */
    position: fixed;
    overscroll-behavior: none;
    touch-action: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    height: 100dvh; /* modern mobile viewport unit, avoids URL-bar jump */
  }

  #status {
    position: absolute;
    top: 6px;
    left: 8px;
    font: 11px monospace;
    color: #6a6;
    z-index: 20;
    pointer-events: none;
    opacity: 0.8;
  }

  #screen_container {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    position: relative;
  }

  #screen_container canvas {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    image-rendering: pixelated;
  }

  /* the text-mode fallback layer v86 also creates */
  #screen_container div {
    white-space: pre;
    font: 14px monospace;
    color: #0f0;
    line-height: 1.15;
  }

  /* Hidden input used purely to summon the mobile OS keyboard.
     Must stay in the DOM and be a real focusable input, but kept
     visually invisible and non-interactive to layout. */
  #kbd_trap {
    position: absolute;
    opacity: 0;
    height: 1px;
    width: 1px;
    top: -100px;
    left: 0;
    pointer-events: none;
    font-size: 16px; /* prevents iOS auto-zoom-on-focus */
  }

  /* Bottom bar: only appears to toggle the keyboard, nothing else */
  #kbd_bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    border-top: 1px solid #222;
    padding: env(safe-area-inset-bottom, 0) 0 0 0;
  }

  #kbd_toggle {
    width: 100%;
    padding: 10px 0;
    background: #111;
    color: #7fd67f;
    border: none;
    font: 13px monospace;
    letter-spacing: 0.5px;
  }

  #kbd_toggle:active {
    background: #1a1a1a;
  }
</style>
</head>
<body>

<div id="app">
  <div id="screen_container">
    <div id="status">Loading…</div>
  </div>
  <div id="kbd_bar">
    <button id="kbd_toggle">⌨ Show Keyboard</button>
  </div>
</div>

<input id="kbd_trap" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" />

<script src="libv86.js"></script>
<script>
  const statusEl = document.getElementById("status");
  const kbdTrap = document.getElementById("kbd_trap");
  const kbdToggle = document.getElementById("kbd_toggle");
  const screenContainer = document.getElementById("screen_container");

  const emulator = new V86({
    wasm_path: "v86.wasm",
    screen_container: screenContainer,
    bios: { url: "seabios.bin" },
    vga_bios: { url: "vgabios.bin" },
    cdrom: { url: "tinycore.iso" },
    autostart: true,
    memory_size: 128 * 1024 * 1024,
    vga_memory_size: 8 * 1024 * 1024,
  });

  emulator.add_listener("emulator-ready", () => {
    statusEl.textContent = "Booting…";
  });

  emulator.add_listener("emulator-started", () => {
    statusEl.textContent = "";
  });

  // --- Virtual keyboard wiring ---
  // Tapping the screen or the keyboard-toggle button focuses the hidden
  // input, which triggers the native mobile keyboard. Keystrokes are
  // forwarded into v86's keyboard handling via its bus.

  let keyboardVisible = false;

  function showKeyboard() {
    kbdTrap.value = "";
    kbdTrap.focus();
    keyboardVisible = true;
    kbdToggle.textContent = "⌨ Hide Keyboard";
  }

  function hideKeyboard() {
    kbdTrap.blur();
    keyboardVisible = false;
    kbdToggle.textContent = "⌨ Show Keyboard";
  }

  kbdToggle.addEventListener("click", () => {
    if (keyboardVisible) hideKeyboard();
    else showKeyboard();
  });

  // Tapping anywhere on the emulator screen also brings up the keyboard,
  // matching expected mobile behavior (tap-to-type).
  screenContainer.addEventListener("click", () => {
    showKeyboard();
  });

  kbdTrap.addEventListener("blur", () => {
    keyboardVisible = false;
    kbdToggle.textContent = "⌨ Show Keyboard";
  });

  // Forward real key events (works for hardware & most soft keyboards
  // that emit proper keydown/keyup, e.g. iPad's floating/hardware kbd).
  kbdTrap.addEventListener("keydown", (e) => {
    emulator.keyboard_send_keys && emulator.bus.send("keyboard-code", e);
  });

  // Forward via v86's built-in DOM key capture as the primary path —
  // v86 already listens on document for keydown/keyup by default when
  // no custom keyboard adapter is set, so focusing kbd_trap is often
  // enough on its own. The explicit "input" handler below is a fallback
  // for soft keyboards (notably iOS) that sometimes only fire composition
  // /input events rather than full keydown events for certain keys.
  let lastValue = "";
  kbdTrap.addEventListener("input", (e) => {
    const val = kbdTrap.value;
    if (val.length > lastValue.length) {
      const added = val.slice(lastValue.length);
      for (const ch of added) {
        emulator.keyboard_send_text(ch);
      }
    } else if (val.length < lastValue.length) {
      // backspace pressed on soft keyboard
      emulator.keyboard_send_text("\x08");
    }
    lastValue = val;
    // reset periodically to avoid unbounded growth
    if (val.length > 500) {
      kbdTrap.value = "";
      lastValue = "";
    }
  });

  // Enter key from soft keyboards (fires as a change/keydown depending
  // on platform; keydown above already covers hardware keyboards).
  kbdTrap.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      emulator.keyboard_send_text("\n");
      e.preventDefault();
      kbdTrap.value = "";
      lastValue = "";
    }
    if (e.key === "Backspace") {
      // handled by input listener too, but ensure it fires even if
      // value was already empty (input event wouldn't fire then)
      if (kbdTrap.value === "") {
        emulator.keyboard_send_text("\x08");
      }
    }
  });

  // Prevent iOS Safari's bounce/zoom gestures from interfering with taps
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  document.addEventListener("touchmove", (e) => {
    if (e.scale !== 1) e.preventDefault();
  }, { passive: false });
</script>

</body>
</html>
