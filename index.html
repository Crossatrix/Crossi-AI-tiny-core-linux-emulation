<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TinyCore Linux</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    position: fixed;
    overscroll-behavior: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100dvh;
  }

  #status {
    position: absolute;
    top: 6px;
    left: 8px;
    font: 11px monospace;
    color: #6a6;
    z-index: 20;
    pointer-events: none;
    opacity: 0.85;
  }

  #screen_container {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #screen_container canvas {
    max-width: 100%;
    max-height: 100%;
    image-rendering: pixelated;
  }

  #screen_container > div {
    white-space: pre;
    font: 14px monospace;
    color: #0f0;
    line-height: 1.15;
  }

  /* --- On-screen keyboard --- */
  #kbd {
    flex: 0 0 auto;
    background: #161616;
    border-top: 1px solid #2a2a2a;
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)) 4px;
    display: none;
  }
  #kbd.visible { display: block; }

  #kbd_toggle_bar {
    flex: 0 0 auto;
    display: flex;
    background: #111;
  }
  #kbd_toggle {
    flex: 1;
    padding: 8px 0;
    background: #111;
    color: #7fd67f;
    border: none;
    font: 12px monospace;
    letter-spacing: 0.5px;
  }
  #kbd_toggle:active { background: #1a1a1a; }

  .kbd_row {
    display: flex;
    gap: 3px;
    margin-bottom: 3px;
  }
  .kbd_row:last-child { margin-bottom: 0; }

  .key {
    flex: 1;
    background: #262626;
    color: #eee;
    border: 1px solid #363636;
    border-radius: 4px;
    font: 12px monospace;
    padding: 8px 0;
    text-align: center;
    min-width: 0;
  }
  .key:active, .key.active {
    background: #3a5a3a;
    border-color: #4a7a4a;
  }
  .key.wide  { flex: 1.6; }
  .key.wider { flex: 2.2; }
  .key.space { flex: 6; }
  .key.mod   { color: #7fd67f; font-size: 11px; }
</style>
</head>
<body>

<div id="app">
  <div id="status">Loading…</div>
  <div id="screen_container"></div>

  <div id="kbd_toggle_bar">
    <button id="kbd_toggle">⌨ Show Keyboard</button>
  </div>

  <div id="kbd">
    <div class="kbd_row">
      <button class="key" data-code="Escape">Esc</button>
      <button class="key" data-code="Digit1">1</button>
      <button class="key" data-code="Digit2">2</button>
      <button class="key" data-code="Digit3">3</button>
      <button class="key" data-code="Digit4">4</button>
      <button class="key" data-code="Digit5">5</button>
      <button class="key" data-code="Digit6">6</button>
      <button class="key" data-code="Digit7">7</button>
      <button class="key" data-code="Digit8">8</button>
      <button class="key" data-code="Digit9">9</button>
      <button class="key" data-code="Digit0">0</button>
      <button class="key" data-code="Minus">-</button>
      <button class="key" data-code="Equal">=</button>
      <button class="key wide" data-code="Backspace">⌫</button>
    </div>
    <div class="kbd_row">
      <button class="key wide" data-code="Tab">Tab</button>
      <button class="key" data-code="KeyQ">q</button>
      <button class="key" data-code="KeyW">w</button>
      <button class="key" data-code="KeyE">e</button>
      <button class="key" data-code="KeyR">r</button>
      <button class="key" data-code="KeyT">t</button>
      <button class="key" data-code="KeyY">y</button>
      <button class="key" data-code="KeyU">u</button>
      <button class="key" data-code="KeyI">i</button>
      <button class="key" data-code="KeyO">o</button>
      <button class="key" data-code="KeyP">p</button>
      <button class="key" data-code="BracketLeft">[</button>
      <button class="key" data-code="BracketRight">]</button>
    </div>
    <div class="kbd_row">
      <button class="key mod wider" data-code="CapsLock" data-lock="1">Caps</button>
      <button class="key" data-code="KeyA">a</button>
      <button class="key" data-code="KeyS">s</button>
      <button class="key" data-code="KeyD">d</button>
      <button class="key" data-code="KeyF">f</button>
      <button class="key" data-code="KeyG">g</button>
      <button class="key" data-code="KeyH">h</button>
      <button class="key" data-code="KeyJ">j</button>
      <button class="key" data-code="KeyK">k</button>
      <button class="key" data-code="KeyL">l</button>
      <button class="key" data-code="Semicolon">;</button>
      <button class="key" data-code="Quote">'</button>
      <button class="key wide" data-code="Enter">Enter</button>
    </div>
    <div class="kbd_row">
      <button class="key mod wider" data-code="ShiftLeft" data-lock="1">Shift</button>
      <button class="key" data-code="KeyZ">z</button>
      <button class="key" data-code="KeyX">x</button>
      <button class="key" data-code="KeyC">c</button>
      <button class="key" data-code="KeyV">v</button>
      <button class="key" data-code="KeyB">b</button>
      <button class="key" data-code="KeyN">n</button>
      <button class="key" data-code="KeyM">m</button>
      <button class="key" data-code="Comma">,</button>
      <button class="key" data-code="Period">.</button>
      <button class="key" data-code="Slash">/</button>
      <button class="key mod wider" data-code="ShiftRight" data-lock="1">Shift</button>
    </div>
    <div class="kbd_row">
      <button class="key mod" data-code="ControlLeft" data-lock="1">Ctrl</button>
      <button class="key mod" data-code="AltLeft" data-lock="1">Alt</button>
      <button class="key space" data-code="Space">Space</button>
      <button class="key mod" data-code="AltRight" data-lock="1">Alt</button>
      <button class="key mod" data-code="ArrowLeft">◀</button>
      <button class="key mod" data-code="ArrowUp">▲</button>
      <button class="key mod" data-code="ArrowDown">▼</button>
      <button class="key mod" data-code="ArrowRight">▶</button>
    </div>
    <div class="kbd_row">
      <button class="key mod" data-code="F1">F1</button>
      <button class="key mod" data-code="F2">F2</button>
      <button class="key mod" data-code="F3">F3</button>
      <button class="key mod" data-code="F4">F4</button>
      <button class="key mod" data-code="F5">F5</button>
      <button class="key mod" data-code="F6">F6</button>
      <button class="key mod" data-code="F7">F7</button>
      <button class="key mod" data-code="F8">F8</button>
      <button class="key mod" data-code="F9">F9</button>
      <button class="key mod" data-code="F10">F10</button>
      <button class="key mod" data-code="F11">F11</button>
      <button class="key mod" data-code="F12">F12</button>
    </div>
  </div>
</div>

<script src="libv86.js"></script>
<script>
  const statusEl = document.getElementById("status");
  const screenContainer = document.getElementById("screen_container");
  const kbdToggle = document.getElementById("kbd_toggle");
  const kbdPanel = document.getElementById("kbd");

  let emulator;
  try {
    emulator = new V86({
      wasm_path: "v86.wasm",
      screen_container: screenContainer,
      bios: { url: "seabios.bin" },
      vga_bios: { url: "vgabios.bin" },
      cdrom: { url: "tinycore.iso" },
      autostart: true,
      memory_size: 128 * 1024 * 1024,
      vga_memory_size: 8 * 1024 * 1024,
    });
  } catch (err) {
    statusEl.textContent = "Emulator init failed: " + err.message;
    throw err;
  }

  emulator.add_listener("emulator-ready", () => {
    statusEl.textContent = "Booting…";
  });

  emulator.add_listener("emulator-started", () => {
    statusEl.textContent = "";
  });

  // --- Touch-to-click bridge ---
  // v86's built-in mouse adapter moves the cursor on touchmove/touchstart,
  // but only ever sets the actual button-down/up state from real
  // mousedown/mouseup events - touchstart/touchend never trigger a
  // "mouse-click" bus event on their own. Without this, tapping only
  // ever moves the pointer and never registers a click.
  let touchIsDown = false;

  screenContainer.addEventListener("touchstart", (e) => {
    if (!emulator.bus || !emulator.mouse_adapter?.enabled) return;
    touchIsDown = true;
    emulator.bus.send("mouse-click", [true, false, false]);
  }, { passive: true });

  screenContainer.addEventListener("touchend", (e) => {
    if (!emulator.bus || !touchIsDown) return;
    touchIsDown = false;
    emulator.bus.send("mouse-click", [false, false, false]);
  }, { passive: true });

  screenContainer.addEventListener("touchcancel", (e) => {
    if (!emulator.bus || !touchIsDown) return;
    touchIsDown = false;
    emulator.bus.send("mouse-click", [false, false, false]);
  }, { passive: true });

  // If v86 hits a runtime error it usually surfaces via console; we
  // don't have a hook for that here, so leave status visible longer
  // in case something silently fails - remove this line once confirmed working.

  // --- Keyboard toggle ---
  kbdToggle.addEventListener("click", () => {
    kbdPanel.classList.toggle("visible");
    kbdToggle.textContent = kbdPanel.classList.contains("visible")
      ? "⌨ Hide Keyboard"
      : "⌨ Show Keyboard";
  });

  // --- Real PS/2 scancode table, extracted from v86's own keyboard
  // adapter (the `w` map inside libv86.js). Values >255 are extended
  // (0xE0-prefixed) scancodes - encoded as two bytes below, exactly
  // like v86's internal m()/l() functions do.
  const SCANCODES = {
    Escape:1, Digit1:2, Digit2:3, Digit3:4, Digit4:5, Digit5:6, Digit6:7,
    Digit7:8, Digit8:9, Digit9:10, Digit0:11, Minus:12, Equal:13,
    Backspace:14, Tab:15, KeyQ:16, KeyW:17, KeyE:18, KeyR:19, KeyT:20,
    KeyY:21, KeyU:22, KeyI:23, KeyO:24, KeyP:25, BracketLeft:26,
    BracketRight:27, Enter:28, ControlLeft:29, KeyA:30, KeyS:31, KeyD:32,
    KeyF:33, KeyG:34, KeyH:35, KeyJ:36, KeyK:37, KeyL:38, Semicolon:39,
    Quote:40, Backquote:41, ShiftLeft:42, Backslash:43, KeyZ:44, KeyX:45,
    KeyC:46, KeyV:47, KeyB:48, KeyN:49, KeyM:50, Comma:51, Period:52,
    Slash:53, ShiftRight:54, AltLeft:56, Space:57, CapsLock:58,
    F1:59, F2:60, F3:61, F4:62, F5:63, F6:64, F7:65, F8:66, F9:67, F10:68,
    F11:87, F12:88,
    ControlRight:57373, AltRight:57400,
    ArrowUp:57416, ArrowLeft:57419, ArrowRight:57421, ArrowDown:57424,
    Home:57415, End:57423, PageUp:57417, PageDown:57425,
    Insert:57426, Delete:57427,
  };

  // --- Sticky modifier state ---
  const heldModifiers = new Set();

  function sendScancode(scancode, isPress) {
    let byte = scancode;
    if (!isPress) byte |= 128; // set break-code bit on release
    if (byte > 255) {
      emulator.bus.send("keyboard-code", byte >> 8);
      emulator.bus.send("keyboard-code", byte & 255);
    } else {
      emulator.bus.send("keyboard-code", byte);
    }
  }

  function keyDown(code) {
    const sc = SCANCODES[code];
    if (sc === undefined) { console.log("No scancode for", code); return; }
    sendScancode(sc, true);
  }

  function keyUp(code) {
    const sc = SCANCODES[code];
    if (sc === undefined) return;
    sendScancode(sc, false);
  }

  document.querySelectorAll(".key").forEach((btn) => {
    const code = btn.dataset.code;
    const isSticky = btn.dataset.lock === "1";

    if (isSticky) {
      btn.addEventListener("click", () => {
        if (heldModifiers.has(code)) {
          heldModifiers.delete(code);
          btn.classList.remove("active");
          keyUp(code);
        } else {
          heldModifiers.add(code);
          btn.classList.add("active");
          keyDown(code);
        }
      });
    } else {
      btn.addEventListener("click", () => {
        keyDown(code);
        setTimeout(() => keyUp(code), 40);

        // auto-release Shift after one keypress, like mobile "sticky shift"
        for (const mod of [...heldModifiers]) {
          if (mod.startsWith("Shift")) {
            heldModifiers.delete(mod);
            document.querySelector(`.key[data-code="${mod}"]`)?.classList.remove("active");
            keyUp(mod);
          }
        }
      });
    }
  });

  // Prevent iOS bounce/zoom from interfering with taps
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  document.addEventListener("touchmove", (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
</script>

</body>
</html>
