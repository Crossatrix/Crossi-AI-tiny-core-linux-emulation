<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TinyCore Linux</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    position: fixed;
    overscroll-behavior: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100dvh;
  }

  #status {
    position: absolute;
    top: 6px;
    left: 8px;
    font: 11px monospace;
    color: #6a6;
    z-index: 20;
    pointer-events: none;
    opacity: 0.85;
  }

  #screen_container {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #screen_container canvas {
    max-width: 100%;
    max-height: 100%;
    image-rendering: pixelated;
  }

  #screen_container > div {
    white-space: pre;
    font: 14px monospace;
    color: #0f0;
    line-height: 1.15;
  }

  /* --- On-screen keyboard --- */
  #kbd {
    flex: 0 0 auto;
    background: #161616;
    border-top: 1px solid #2a2a2a;
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)) 4px;
    display: none;
  }
  #kbd.visible { display: block; }

  #kbd_toggle_bar {
    flex: 0 0 auto;
    display: flex;
    background: #111;
  }
  #kbd_toggle {
    flex: 1;
    padding: 8px 0;
    background: #111;
    color: #7fd67f;
    border: none;
    font: 12px monospace;
    letter-spacing: 0.5px;
  }
  #kbd_toggle:active { background: #1a1a1a; }

  #btn_paste {
    flex: 0 0 90px;
    padding: 8px 0;
    background: #111;
    color: #7fd67f;
    border: none;
    border-left: 1px solid #2a2a2a;
    font: 12px monospace;
    letter-spacing: 0.5px;
  }
  #btn_paste:active { background: #1a1a1a; }

  .kbd_row {
    display: flex;
    gap: 3px;
    margin-bottom: 3px;
  }
  .kbd_row:last-child { margin-bottom: 0; }

  .key {
    flex: 1;
    background: #262626;
    color: #eee;
    border: 1px solid #363636;
    border-radius: 4px;
    font: 12px monospace;
    padding: 8px 0;
    text-align: center;
    min-width: 0;
  }
  .key:active, .key.active {
    background: #3a5a3a;
    border-color: #4a7a4a;
  }
  .key.wide  { flex: 1.6; }
  .key.wider { flex: 2.2; }
  .key.space { flex: 6; }
  .key.mod   { color: #7fd67f; font-size: 11px; }

  /* --- Mobile trackpad + click buttons --- */
  .mobile-only { display: none; }
  @media (pointer: coarse) {
    .mobile-only { display: flex; }
  }

  #pointer_bar {
    flex: 0 0 auto;
    gap: 4px;
    padding: 4px;
    background: #161616;
    border-top: 1px solid #2a2a2a;
  }

  #trackpad {
    flex: 1;
    height: 64px;
    background: #202020;
    border: 1px solid #333;
    border-radius: 6px;
    touch-action: none;
  }
  #trackpad.active {
    background: #26332a;
    border-color: #3a5a3a;
  }

  .mouse_btn {
    width: 64px;
    background: #262626;
    color: #eee;
    border: 1px solid #363636;
    border-radius: 6px;
    font: 11px monospace;
  }
  .mouse_btn:active, .mouse_btn.active {
    background: #3a5a3a;
    border-color: #4a7a4a;
  }
</style>
</head>
<body>

<div id="app">
  <div id="status">Loading…</div>
  <div id="screen_container"></div>

  <div id="pointer_bar" class="mobile-only">
    <div id="trackpad"></div>
    <button class="mouse_btn" id="btn_lclick">Left</button>
    <button class="mouse_btn" id="btn_rclick">Right</button>
  </div>

  <div id="kbd_toggle_bar">
    <button id="kbd_toggle">⌨ Show Keyboard</button>
    <button id="btn_paste">📋 Paste</button>
  </div>

  <div id="kbd">
    <div class="kbd_row">
      <button class="key" data-code="Escape">Esc</button>
      <button class="key" data-code="Backquote" data-lower="`" data-shift="~">`</button>
      <button class="key" data-code="Digit1" data-lower="1" data-shift="!">1</button>
      <button class="key" data-code="Digit2" data-lower="2" data-shift="@">2</button>
      <button class="key" data-code="Digit3" data-lower="3" data-shift="#">3</button>
      <button class="key" data-code="Digit4" data-lower="4" data-shift="$">4</button>
      <button class="key" data-code="Digit5" data-lower="5" data-shift="%">5</button>
      <button class="key" data-code="Digit6" data-lower="6" data-shift="^">6</button>
      <button class="key" data-code="Digit7" data-lower="7" data-shift="&">7</button>
      <button class="key" data-code="Digit8" data-lower="8" data-shift="*">8</button>
      <button class="key" data-code="Digit9" data-lower="9" data-shift="(">9</button>
      <button class="key" data-code="Digit0" data-lower="0" data-shift=")">0</button>
      <button class="key" data-code="Minus" data-lower="-" data-shift="_">-</button>
      <button class="key" data-code="Equal" data-lower="=" data-shift="+">=</button>
      <button class="key wide" data-code="Backspace">⌫</button>
    </div>
    <div class="kbd_row">
      <button class="key wide" data-code="Tab">Tab</button>
      <button class="key" data-code="KeyQ" data-lower="q" data-shift="Q">q</button>
      <button class="key" data-code="KeyW" data-lower="w" data-shift="W">w</button>
      <button class="key" data-code="KeyE" data-lower="e" data-shift="E">e</button>
      <button class="key" data-code="KeyR" data-lower="r" data-shift="R">r</button>
      <button class="key" data-code="KeyT" data-lower="t" data-shift="T">t</button>
      <button class="key" data-code="KeyY" data-lower="y" data-shift="Y">y</button>
      <button class="key" data-code="KeyU" data-lower="u" data-shift="U">u</button>
      <button class="key" data-code="KeyI" data-lower="i" data-shift="I">i</button>
      <button class="key" data-code="KeyO" data-lower="o" data-shift="O">o</button>
      <button class="key" data-code="KeyP" data-lower="p" data-shift="P">p</button>
      <button class="key" data-code="BracketLeft" data-lower="[" data-shift="{">[</button>
      <button class="key" data-code="BracketRight" data-lower="]" data-shift="}">]</button>
    </div>
    <div class="kbd_row">
      <button class="key mod wider" data-code="CapsLock" data-lock="1">Caps</button>
      <button class="key" data-code="KeyA" data-lower="a" data-shift="A">a</button>
      <button class="key" data-code="KeyS" data-lower="s" data-shift="S">s</button>
      <button class="key" data-code="KeyD" data-lower="d" data-shift="D">d</button>
      <button class="key" data-code="KeyF" data-lower="f" data-shift="F">f</button>
      <button class="key" data-code="KeyG" data-lower="g" data-shift="G">g</button>
      <button class="key" data-code="KeyH" data-lower="h" data-shift="H">h</button>
      <button class="key" data-code="KeyJ" data-lower="j" data-shift="J">j</button>
      <button class="key" data-code="KeyK" data-lower="k" data-shift="K">k</button>
      <button class="key" data-code="KeyL" data-lower="l" data-shift="L">l</button>
      <button class="key" data-code="Semicolon" data-lower=";" data-shift=":">;</button>
      <button class="key" data-code="Quote" data-lower="'" data-shift="&quot;">'</button>
      <button class="key wide" data-code="Enter">Enter</button>
    </div>
    <div class="kbd_row">
      <button class="key mod wider" data-code="ShiftLeft" data-lock="1">Shift</button>
      <button class="key" data-code="Backslash" data-lower="\" data-shift="|">\</button>
      <button class="key" data-code="KeyZ" data-lower="z" data-shift="Z">z</button>
      <button class="key" data-code="KeyX" data-lower="x" data-shift="X">x</button>
      <button class="key" data-code="KeyC" data-lower="c" data-shift="C">c</button>
      <button class="key" data-code="KeyV" data-lower="v" data-shift="V">v</button>
      <button class="key" data-code="KeyB" data-lower="b" data-shift="B">b</button>
      <button class="key" data-code="KeyN" data-lower="n" data-shift="N">n</button>
      <button class="key" data-code="KeyM" data-lower="m" data-shift="M">m</button>
      <button class="key" data-code="Comma" data-lower="," data-shift="<">,</button>
      <button class="key" data-code="Period" data-lower="." data-shift=">">.</button>
      <button class="key" data-code="Slash" data-lower="/" data-shift="?">/</button>
      <button class="key mod wider" data-code="ShiftRight" data-lock="1">Shift</button>
    </div>
    <div class="kbd_row">
      <button class="key mod" data-code="ControlLeft" data-lock="1">Ctrl</button>
      <button class="key mod" data-code="AltLeft" data-lock="1">Alt</button>
      <button class="key space" data-code="Space">Space</button>
      <button class="key mod" data-code="AltRight" data-lock="1">Alt</button>
      <button class="key mod" data-code="ArrowLeft">◀</button>
      <button class="key mod" data-code="ArrowUp">▲</button>
      <button class="key mod" data-code="ArrowDown">▼</button>
      <button class="key mod" data-code="ArrowRight">▶</button>
    </div>
    <div class="kbd_row">
      <button class="key mod" data-code="F1">F1</button>
      <button class="key mod" data-code="F2">F2</button>
      <button class="key mod" data-code="F3">F3</button>
      <button class="key mod" data-code="F4">F4</button>
      <button class="key mod" data-code="F5">F5</button>
      <button class="key mod" data-code="F6">F6</button>
      <button class="key mod" data-code="F7">F7</button>
      <button class="key mod" data-code="F8">F8</button>
      <button class="key mod" data-code="F9">F9</button>
      <button class="key mod" data-code="F10">F10</button>
      <button class="key mod" data-code="F11">F11</button>
      <button class="key mod" data-code="F12">F12</button>
    </div>
  </div>
</div>

<script src="libv86.js"></script>
<script>
  const statusEl = document.getElementById("status");
  const screenContainer = document.getElementById("screen_container");
  const kbdToggle = document.getElementById("kbd_toggle");
  const kbdPanel = document.getElementById("kbd");

  let emulator;
  try {
    emulator = new V86({
      wasm_path: "v86.wasm",
      screen_container: screenContainer,
      bios: { url: "seabios.bin" },
      vga_bios: { url: "vgabios.bin" },
      cdrom: { url: "tinycore.iso" },
      autostart: true,
      memory_size: 128 * 1024 * 1024,
      vga_memory_size: 8 * 1024 * 1024,
      network_relay_url: "wss://relay.widgetry.org/",
    });
  } catch (err) {
    statusEl.textContent = "Emulator init failed: " + err.message;
    throw err;
  }

  emulator.add_listener("emulator-ready", () => {
    statusEl.textContent = "Booting…";
  });

  emulator.add_listener("emulator-started", () => {
    statusEl.textContent = "";
  });

  // --- Block direct screen touches from reaching v86's own touch
  // handling. v86 listens on `window` for touchstart/touchmove/touchend
  // to move the cursor - but we want touching the display itself to do
  // nothing, and only allow cursor movement via the dedicated trackpad
  // below. Capturing + stopping propagation here prevents v86's window
  // listeners from ever seeing these events when they originate on the
  // emulator screen. Desktop mouse events are untouched, so PC behavior
  // stays completely normal.
  ["touchstart", "touchmove", "touchend", "touchcancel"].forEach((evt) => {
    screenContainer.addEventListener(evt, (e) => {
      e.stopPropagation();
    }, { capture: true, passive: true });
  });

  // --- Mobile trackpad: drag = relative cursor movement only, no click.
  // Uses the same "mouse-delta" bus event v86's own mousemove handler
  // sends, so movement behaves identically to a real mouse's relative mode.
  const trackpad = document.getElementById("trackpad");
  let lastTX = 0, lastTY = 0, dragging = false;

  trackpad.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    lastTX = t.clientX;
    lastTY = t.clientY;
    dragging = true;
    trackpad.classList.add("active");
  }, { passive: true });

  trackpad.addEventListener("touchmove", (e) => {
    if (!dragging || !emulator.bus) return;
    const t = e.touches[0];
    const dx = t.clientX - lastTX;
    const dy = t.clientY - lastTY;
    lastTX = t.clientX;
    lastTY = t.clientY;
    emulator.bus.send("mouse-delta", [dx, -dy]);
  }, { passive: true });

  ["touchend", "touchcancel"].forEach((evt) => {
    trackpad.addEventListener(evt, () => {
      dragging = false;
      trackpad.classList.remove("active");
    }, { passive: true });
  });

  // --- Left / Right click buttons ---
  // Sends the same "mouse-click" bus event v86's own mousedown/mouseup
  // handlers use: [leftDown, middleDown, rightDown].
  function wireClickButton(btn, buttonIndex) {
    const sendState = (down) => {
      if (!emulator.bus) return;
      const state = [false, false, false];
      state[buttonIndex] = down;
      emulator.bus.send("mouse-click", state);
      btn.classList.toggle("active", down);
    };
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); sendState(true); }, { passive: false });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); sendState(false); }, { passive: false });
    btn.addEventListener("touchcancel", () => sendState(false));
    // Also support plain clicks (e.g. testing on a touch-emulating desktop browser)
    btn.addEventListener("mousedown", () => sendState(true));
    btn.addEventListener("mouseup", () => sendState(false));
  }
  wireClickButton(document.getElementById("btn_lclick"), 0);
  wireClickButton(document.getElementById("btn_rclick"), 2);

  // --- Keyboard toggle ---
  kbdToggle.addEventListener("click", () => {
    kbdPanel.classList.toggle("visible");
    kbdToggle.textContent = kbdPanel.classList.contains("visible")
      ? "⌨ Hide Keyboard"
      : "⌨ Show Keyboard";
  });

  // --- Paste from system clipboard ---
  // Reads the device clipboard and types it into the guest OS using
  // v86's own keyboard_send_text(), which simulates each character as
  // a real keypress internally - so it works regardless of what's
  // focused inside the guest (terminal, text field, etc).
  const btnPaste = document.getElementById("btn_paste");
  btnPaste.addEventListener("click", async () => {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      statusEl.textContent = "Clipboard access not supported in this browser.";
      setTimeout(() => (statusEl.textContent = ""), 3000);
      return;
    }
    try {
      const text = await navigator.clipboard.readText();
      if (!text) return;
      btnPaste.textContent = "…";
      await emulator.keyboard_send_text(text);
      btnPaste.textContent = "📋 Paste";
    } catch (err) {
      // Most likely a permissions prompt was denied, or the page
      // isn't focused/HTTPS - clipboard reads require both.
      statusEl.textContent = "Clipboard permission denied.";
      btnPaste.textContent = "📋 Paste";
      setTimeout(() => (statusEl.textContent = ""), 3000);
    }
  });

  // --- Real PS/2 scancode table, extracted from v86's own keyboard
  // adapter (the `w` map inside libv86.js). Values >255 are extended
  // (0xE0-prefixed) scancodes - encoded as two bytes below, exactly
  // like v86's internal m()/l() functions do.
  const SCANCODES = {
    Escape:1, Digit1:2, Digit2:3, Digit3:4, Digit4:5, Digit5:6, Digit6:7,
    Digit7:8, Digit8:9, Digit9:10, Digit0:11, Minus:12, Equal:13,
    Backspace:14, Tab:15, KeyQ:16, KeyW:17, KeyE:18, KeyR:19, KeyT:20,
    KeyY:21, KeyU:22, KeyI:23, KeyO:24, KeyP:25, BracketLeft:26,
    BracketRight:27, Enter:28, ControlLeft:29, KeyA:30, KeyS:31, KeyD:32,
    KeyF:33, KeyG:34, KeyH:35, KeyJ:36, KeyK:37, KeyL:38, Semicolon:39,
    Quote:40, Backquote:41, ShiftLeft:42, Backslash:43, KeyZ:44, KeyX:45,
    KeyC:46, KeyV:47, KeyB:48, KeyN:49, KeyM:50, Comma:51, Period:52,
    Slash:53, ShiftRight:54, AltLeft:56, Space:57, CapsLock:58,
    F1:59, F2:60, F3:61, F4:62, F5:63, F6:64, F7:65, F8:66, F9:67, F10:68,
    F11:87, F12:88,
    ControlRight:57373, AltRight:57400,
    ArrowUp:57416, ArrowLeft:57419, ArrowRight:57421, ArrowDown:57424,
    Home:57415, End:57423, PageUp:57417, PageDown:57425,
    Insert:57426, Delete:57427,
  };

  // --- Sticky modifier state ---
  const heldModifiers = new Set();

  function sendScancode(scancode, isPress) {
    let byte = scancode;
    if (!isPress) byte |= 128; // set break-code bit on release
    if (byte > 255) {
      emulator.bus.send("keyboard-code", byte >> 8);
      emulator.bus.send("keyboard-code", byte & 255);
    } else {
      emulator.bus.send("keyboard-code", byte);
    }
  }

  function keyDown(code) {
    const sc = SCANCODES[code];
    if (sc === undefined) { console.log("No scancode for", code); return; }
    sendScancode(sc, true);
  }

  function keyUp(code) {
    const sc = SCANCODES[code];
    if (sc === undefined) return;
    sendScancode(sc, false);
  }

  // --- Shift-aware key labels ---
  // The physical PS/2 scancode sent is always the same regardless of
  // Shift state - the guest OS itself combines scancode + shift to
  // produce the right character. So we only need to update what the
  // button *displays*, not what code it sends.
  const labeledKeys = document.querySelectorAll(".key[data-lower]");

  function isShiftActive() {
    return heldModifiers.has("ShiftLeft") || heldModifiers.has("ShiftRight");
  }
  function isCapsActive() {
    return heldModifiers.has("CapsLock");
  }

  function updateKeyLabels() {
    const shift = isShiftActive();
    const caps = isCapsActive();
    labeledKeys.forEach((btn) => {
      const lower = btn.dataset.lower;
      const upper = btn.dataset.shift;
      const isLetter = /^[a-z]$/i.test(lower);
      let label;
      if (isLetter) {
        // Caps and Shift both flip case; combined they cancel out
        const useUpper = caps !== shift;
        label = useUpper ? upper : lower;
      } else {
        label = shift ? upper : lower;
      }
      btn.textContent = label;
    });
  }

  document.querySelectorAll(".key").forEach((btn) => {
    const code = btn.dataset.code;
    const isSticky = btn.dataset.lock === "1";

    if (isSticky && (code.startsWith("Shift") || code === "CapsLock")) {
      btn.addEventListener("click", updateKeyLabels);
    }

    if (isSticky) {
      btn.addEventListener("click", () => {
        if (heldModifiers.has(code)) {
          heldModifiers.delete(code);
          btn.classList.remove("active");
          keyUp(code);
        } else {
          heldModifiers.add(code);
          btn.classList.add("active");
          keyDown(code);
        }
      });
    } else {
      btn.addEventListener("click", () => {
        keyDown(code);
        setTimeout(() => keyUp(code), 40);

        // auto-release Shift after one keypress, like mobile "sticky shift"
        for (const mod of [...heldModifiers]) {
          if (mod.startsWith("Shift")) {
            heldModifiers.delete(mod);
            document.querySelector(`.key[data-code="${mod}"]`)?.classList.remove("active");
            keyUp(mod);
          }
        }
        updateKeyLabels();
      });
    }
  });

  // Prevent iOS bounce/zoom from interfering with taps
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  document.addEventListener("touchmove", (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
</script>

</body>
</html>
